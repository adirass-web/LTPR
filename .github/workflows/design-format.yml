name: Format design branch

on:
  push:
    branches: [design/premium-bilingual-system]
    paths:
      - .github/workflows/design-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-bilingual-system
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src
      - name: Commit formatting
        run: |
          if git diff --quiet -- src; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: format premium redesign"
          git push origin HEAD:design/premium-bilingual-system
