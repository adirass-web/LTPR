name: Production smoke

on:
  push:
    branches: [home/positioning-clarity]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify routes
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          home_url='https://cyberdrtabansky.com/en/'
          media_url='https://cyberdrtabansky.com/en/media/'
          pages_url='https://cyberdrtabansky.pages.dev/en/'
          matched='false'
          home_status=''
          media_status=''
          pages_status=''

          for attempt in {1..24}; do
            home_status=$(curl -L --silent --show-error --output /tmp/home.html --write-out '%{http_code}' "$home_url" || true)
            media_status=$(curl -L --silent --show-error --output /tmp/media.html --write-out '%{http_code}' "$media_url" || true)
            pages_status=$(curl -L --silent --show-error --output /tmp/pages.html --write-out '%{http_code}' "$pages_url" || true)
            if [[ "$home_status" == '200' ]] && grep -q 'Strategic technology adviser' /tmp/home.html && grep -q 'Only work already in the public record is named here' /tmp/home.html; then
              matched='true'
              break
            fi
            sleep 10
          done

          home_title=$(python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/home.html').read_text(errors='ignore') if Path('/tmp/home.html').exists() else ''
          m = re.search(r'<title>(.*?)</title>', html, re.I | re.S)
          print(re.sub(r'\s+', ' ', m.group(1)).strip() if m else 'not found')
          PY
          )
          media_marker='false'
          if [[ -f /tmp/media.html ]] && grep -q 'POLITICO Europe' /tmp/media.html && grep -q 'Selected international forums' /tmp/media.html; then
            media_marker='true'
          fi

          cat > /tmp/report.md <<EOF
          ## Production deployment smoke test

          - Canonical Home: \`$home_status\`
          - Canonical Media: \`$media_status\`
          - Pages Home: \`$pages_status\`
          - New Home positioning present: **$matched**
          - Media prestige markers present: **$media_marker**
          - Production title: \`$home_title\`
          - Tested commit: \`be9f7aae6f405cc2ade4da33baebb0883225c4f2\`

          $(if [[ "$matched" == 'true' && "$media_marker" == 'true' ]]; then echo '✅ Production is serving the approved Home redesign and the existing Media hierarchy.'; else echo '❌ Production did not pass all smoke checks.'; fi)
          EOF

          if [[ "$matched" != 'true' || "$media_marker" != 'true' ]]; then
            cat /tmp/report.md
            exit 1
          fi
      - name: Comment on merged PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 17 --repo adirass-web/LTPR --body-file /tmp/report.md
