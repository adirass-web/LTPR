name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Astro production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install visual QA browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture responsive screenshots and DOM metrics
        run: |
          mkdir -p screenshots
          python3 -m http.server 4321 --directory dist > /tmp/ltpr-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/en/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium, devices } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const captures = [
            { name: 'home-desktop', url: 'http://127.0.0.1:4321/en/', viewport: { width: 1440, height: 1000 } },
            { name: 'home-tablet', url: 'http://127.0.0.1:4321/en/', viewport: { width: 768, height: 1024 } },
            { name: 'home-mobile', url: 'http://127.0.0.1:4321/en/', device: devices['iPhone 13'] },
            { name: 'media-desktop', url: 'http://127.0.0.1:4321/en/media/', viewport: { width: 1440, height: 1000 } },
          ];
          const metrics = {};

          for (const capture of captures) {
            const context = await browser.newContext(capture.device ?? { viewport: capture.viewport });
            const page = await context.newPage();
            await page.goto(capture.url, { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              for (let y = 0; y < document.body.scrollHeight; y += 600) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 80));
              }
              window.scrollTo(0, 0);
            });
            await page
              .waitForFunction(() => [...document.images].every((image) => image.complete), undefined, {
                timeout: 10000,
              })
              .catch(() => undefined);
            await page.screenshot({ path: `screenshots/${capture.name}.png`, fullPage: true });
            metrics[capture.name] = await page.evaluate(() => ({
              title: document.title,
              h1Count: document.querySelectorAll('h1').length,
              headings: [...document.querySelectorAll('h1, h2')].map((heading) => heading.textContent?.trim()),
              viewportWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bookCoverLoaded: Boolean(
                document.querySelector('.profile-book img')?.naturalWidth &&
                  document.querySelector('.profile-book img')?.naturalHeight
              ),
            }));
            await context.close();
          }

          await browser.close();
          await writeFile('screenshots/metrics.json', JSON.stringify(metrics, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.sha }}
          path: screenshots
          if-no-files-found: error
          retention-days: 3
