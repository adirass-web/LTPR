name: Format RTL hardening

on:
  push:
    branches: [design/rtl-responsive-hardening]
    paths:
      - .github/workflows/design-rtl-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/rtl-responsive-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/media/MediaPressCard.astro src/components/media/MoreCoverageItem.astro src/pages/he/design-system.astro
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/components/media/MediaPressCard.astro src/components/media/MoreCoverageItem.astro src/pages/he/design-system.astro; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/media/MediaPressCard.astro src/components/media/MoreCoverageItem.astro src/pages/he/design-system.astro
          git commit -m "style: format RTL hardening"
          git push origin HEAD:design/rtl-responsive-hardening
